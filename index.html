  <body style="background: #ffffff;">
    <!-- Pre-mount background. The body paints before React mounts (and shows
         through iOS over-scroll after), so it must match the route being
         loaded: white for the landing/marketing/auth pages, cosmic #080310 for
         the theme-aware app pages unless the user stored the vedic theme.
         Runs here — parser-blocking, right after <body> opens — so it lands
         before first paint. -->
    <script>
      (function () {
        var dark = /^\/(kundali|profile|chat|ai-chat|upcoming-features)(\/|$)/.test(location.pathname);
        if (dark) {
          // Vedic is the app's default, so only an explicit cosmic choice goes dark.
          try { dark = localStorage.getItem('kundali-theme') === 'cosmic'; } catch (e) { dark = false; }
          if (dark) document.body.style.background = '#080310';
        }
      })();
    </script>
